    <script src="../js/produto_listar.js" defer></script>
    <title>Listagem de Produtos</title>

<body>
    <header>
        <nav>
            <a class="logo" href="../index.html">Compras Interno</a>
            <a href="../index.html">Home</a>

            <span class="titulo_menu">Usuários</span>
            <a href="./usuario_cadastrar.html">Cadastrar</a>
            <a href="./usuario_listar.html">Listar</a>

            <span class="titulo_menu">Produtos</span>
            <a href="./produto_cadastrar.html">Cadastrar</a>

    <main>
        <h1>Produtos cadastrados</h1>

        <div class="painel">
            <div class="filtros">
                <input type="text" id="busca" placeholder="Buscar por nome ou categoria...">
                <button id="btn_atualizar" class="secundario">Atualizar lista</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Cód.</th>
                        <th>Nome</th>
                        <th>Categoria</th>
                        <th>Preço</th>
                        <th>Estoque</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela_produtos"></tbody>
            </table>
            <div id="resposta" class="resposta"></div>
        </div>
